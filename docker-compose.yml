services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - companion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Public community build; pin the multi-platform manifest for reproducible pulls.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: companion
      MINIO_ROOT_PASSWORD: companion-secret
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - companion-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # The server image includes mc; avoid a second dependency on retired MinIO images.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 companion companion-secret &&
      mc mb --ignore-existing local/skill-archives &&
      mc anonymous set none local/skill-archives
      "

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  companion-postgres:
  companion-minio:
