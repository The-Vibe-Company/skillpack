# Gitleaks configuration for the Hygiene CI scan.
# Extends the default ruleset; do not add broad allowlists here.

[extend]
useDefault = true

# The debug-companions-prod operator skill ships redaction unit tests whose
# fixtures are deliberately secret-shaped but fully synthetic (documentation
# JWT, base64 of "BoxKeySecret...", ghp_abcdefgh12345, ...). They exist to
# prove prodlib.redact() masks those shapes and never contain real values.
[allowlist]
description = "Synthetic fixtures and the public IndexNow ownership proof"
paths = [
  '''\.claude/skills/debug-companions-prod/scripts/test_prodlib\.py''',
  '''\.agents/skills/debug-companions-prod/scripts/test_prodlib\.py''',
]

# Runtime v3 lease-fencing tests need stable UUID-shaped tokens so assertions can distinguish
# independent claims. These three exact literals are synthetic fixtures, not credentials. Keep the
# exemption value-specific because the history scan evaluates the commits that introduced them.
regexes = [
  '''3c706ec6-5caf-41fc-a009-614730726ebe''',
  '''a60fa0eb-e514-4453-94ef-d6668220fb85''',
  '''2aa20f71-0f55-4f57-82a8-561256f42da3''',
  # Public IndexNow proof served verbatim at /<key>.txt, not a credential.
  # Value-specific so history scans also accept its original introduction.
  '''498a19c36795d0a81cb9c7d2a398d449''',
  # sha256 digests of public Stageshow files (kit/brands/1password*.svg, kit/keys.*) in the portable
  # usage inventory: their file names contain "password"/"key", which trips generic-api-key.
  '''ad593cc8ca4fb8e3ae066fdd4dd3d86cb9084cad8b9092275e3ecd27fb35cc65''',
  '''36ef31dc8e1ea5a2a7f4a1a53dc874c61170056bdacacd24ea4fa4c8cd050af8''',
  '''929ef94999bfd7fd6bc78c5026c98f5b4ff8483c8aecfa3bc87cfb2e466cfc3c''',
  '''ab45f610aa1c2ccac54a966e8e8c804ed601258cc4e8071278d48cb8bc4f6c59''',
]
